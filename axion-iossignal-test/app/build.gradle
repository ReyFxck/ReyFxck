plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.systemui.signalbar_ar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.android.systemui.signalbar_ar'
        minSdk 35
        targetSdk 35
        versionCode 2
        versionName '1.0.1-test'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
