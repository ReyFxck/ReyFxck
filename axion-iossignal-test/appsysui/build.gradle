plugins { id 'com.android.application' }

android {
    namespace 'com.android.systemui.signalbar_ar'
    compileSdk 35
    defaultConfig {
        applicationId 'com.android.systemui.signalbar_ar'
        minSdk 35
        targetSdk 35
        versionCode 6
        versionName '1.0.5-systemui-test'
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
