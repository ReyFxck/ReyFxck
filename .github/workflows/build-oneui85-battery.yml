name: Build One UI 8.5 battery test

on:
  push:
    branches:
      - axion-oneui85-battery-test
    paths:
      - 'axion-oneui85-battery-test/**'
      - '.github/workflows/build-oneui85-battery.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: axion-oneui85-battery-test
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Collect
        run: |
          mkdir -p out
          cp axion-oneui85-battery-test/app/build/outputs/apk/debug/app-debug.apk out/OneUI85Battery-test-debug.apk
          cp axion-oneui85-battery-test/app/build/outputs/apk/release/app-release.apk out/OneUI85Battery-test-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OneUI85Battery-test-apks
          path: out/*.apk
          if-no-files-found: error
