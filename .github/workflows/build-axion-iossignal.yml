name: Build Axion IosSignal test APK

on:
  push:
    branches:
      - axion-iossignal-test
    paths:
      - 'axion-iossignal-test/**'
      - '.github/workflows/build-axion-iossignal.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: axion-iossignal-test
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp axion-iossignal-test/app/build/outputs/apk/debug/app-debug.apk out/IosSignalFixed-test-debug.apk
          cp axion-iossignal-test/app/build/outputs/apk/release/app-release.apk out/IosSignalFixed-test-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: IosSignalFixed-test-apks
          path: out/*.apk
          if-no-files-found: error
