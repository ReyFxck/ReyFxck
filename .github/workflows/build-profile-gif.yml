name: Build profile GIF

on:
  push:
    paths:
      - ".profile-assets/mario.part03"

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild uploaded GIF
        shell: bash
        run: |
          mkdir -p assets
          cat .profile-assets/mario.part00 .profile-assets/mario.part01 .profile-assets/mario.part02 .profile-assets/mario.part03 | base64 --decode > assets/super-mario-world.gif
          rm -rf .profile-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add profile GIF"
          git push
