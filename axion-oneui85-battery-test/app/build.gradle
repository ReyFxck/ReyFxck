plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.systemui.battery.oneui85'
    compileSdk 35

    defaultConfig {
        applicationId 'com.android.systemui.battery.oneui85'
        minSdk 35
        targetSdk 35
        versionCode 3
        versionName '0.3-oneui8-axion-fit'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
