plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reyfxck.axioniossignalpreview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reyfxck.axioniossignalpreview'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
